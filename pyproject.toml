[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-radar"
version = "0.1.0"
description = "A complete MIMO FMCW radar, from chirp to track, in NumPy: simulator, signal processing, tracking, a Verilog CFAR core, and a laptop sonar."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Elmehdi Essamit" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "matplotlib>=3.6"]
keywords = ["radar", "fmcw", "mimo", "signal-processing", "dsp", "cfar", "kalman-filter", "sonar", "mmwave", "fpga"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
sonar = ["sounddevice>=0.4"]
dev = ["pytest>=7", "scipy"]

[project.urls]
Homepage = "https://github.com/akeanti/mira-radar"

[project.scripts]
mira = "mira.cli:main"

[tool.setuptools.packages.find]
include = ["mira*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
